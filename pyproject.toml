[project]
name = "role-ai"
version = "0.1.0"
description = "Recommendation engine for Role Platform"
requires-python = ">=3.11"

dependencies = [
    "psycopg2-binary>=2.9,<3",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "click>=8.1,<9",
]

[project.optional-dependencies]
ml = [
    "implicit>=0.7,<1",
]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
role-ai = "src.cli:cli"
